# Render Blueprint — one-click backend deployment
# Deploy: https://render.com/deploy?repo=https://github.com/SurendiranSivam/yuno-ai-payment-orchestrator

services:
  - type: web
    name: yuno-ai-backend
    runtime: python
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./yuno.db
      - key: OPENAI_API_KEY
        value: ""
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /api/health
